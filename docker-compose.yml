services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: amonhen
      POSTGRES_PASSWORD: amonhen
      POSTGRES_DB: amonhen
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amonhen"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://amonhen:amonhen@db:5432/amonhen
      CORS_ORIGINS: "http://localhost:3000,http://localhost"
      ENTSOE_API_KEY: ${ENTSOE_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
